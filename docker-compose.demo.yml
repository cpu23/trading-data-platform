x-demo-environment: &demo-environment
  DEPLOYMENT_MODE: demo
  DISABLE_AUTH: "true"
  EXTERNAL_ORIGIN: http://127.0.0.1:${API_HOST_PORT:-8000}
  DB_USER: demo
  DB_PASSWORD: demo
  DB_NAME: trading_data
  FRED_API_KEY: demo-disabled
  OPENROUTER_API_KEY: demo-disabled
  OPENROUTER_MODEL: demo/deterministic
  OANDA_API_KEY: demo-disabled
  TWITTERAPI_KEY: ""
  DEMO_MODE: "true"
  DEMO_LIVE_INTERVAL_SECONDS: "5"

services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
      target: demo
    image: trading-data-postgres-demo:0.1.0
    pids_limit: 256
    mem_limit: 768m
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: trading_data
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d trading_data"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-data-platform:0.1.0
    pids_limit: 128
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    working_dir: /app/api
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *demo-environment
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - demo_news:/var/lib/trading-data/news:ro
      - demo_logs:/var/log/trading-data
      - demo_state:/app/state
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-data-platform:0.1.0
    pids_limit: 256
    mem_limit: 2g
    security_opt: ["no-new-privileges:true"]
    working_dir: /app/orchestrator
    command: ["/app/.venv/bin/python", "-m", "roles", "run", "worker"]
    environment: *demo-environment
    volumes:
      - demo_news:/var/lib/trading-data/news
      - demo_logs:/var/log/trading-data
      - demo_state:/app/state:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30m
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "roles", "check", "worker"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 15s

volumes:
  demo_pgdata:
  demo_news:
  demo_logs:
  demo_state:
