required_material_evidence:
- Azure growth included 8 points from AI services where demand remained higher than our available capacity.
- Microsoft Cloud gross margin percentage decreased roughly 2 points year-over-year to 69%
- Activision contributed a net impact of approximately 3 points to revenue growth, was a 2 point drag on operating income growth, and had a negative 6 cent impact to earnings per share.
- Capital expenditures including finance leases were $19 billion
- Cash flow from operations was $37.2 billion, up 29%
- Free cash flow was $23.3 billion
- In Azure, we expect Q1 revenue growth to be 28% to 29% in constant currency.
- we will scale our infrastructure investments with FY25 capital expenditures expected to be higher than FY24
- the distinguishing between being at the higher end or at the lower end really was some softness we saw in a few European geos on non-AI consumption
- Microsoft Cloud gross margin percentage should be roughly 70%
- existing AI capacity constraints
- roughly half is for infrastructure needs where we continue to build and lease datacenters that will support monetization over the next 15 years and beyond
