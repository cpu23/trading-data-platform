expected_material_observations:
- 'No material update: the producer window contains no official information about AI capacity economics, capex trajectory, cloud margins, Azure growth outcomes, or any other financial or operating results, so the correct synthesis is a concise insufficient-evidence / no-material-change response rather than an invented update.'
- 'The only substantive official update in the window is the July 16, 2024 scheduling notice confirming FY2024 fourth-quarter results will be published after market close on July 30, 2024, with a live webcast at 2:30 p.m. Pacific Time; it is scheduling and logistics content with zero financial, operating, capacity, capex, margin, or guidance content and supports no economics claim.'
- 'Consensus is explicitly unavailable as of the producer cutoff (unavailable_as_of_producer_cutoff): any beat/miss, expectation-gap, or surprise framing is unsupported.'
- 'Explicit unknowns are expected where a compliant producer names them: whether Q4 Azure growth lands within/above/below the standing 30%-31% CC guidance range, Q4 capital expenditures including finance leases, the Q4 Microsoft Cloud gross margin percentage, and any change to useful-life accounting-estimate discussion - all first knowable at the release.'
- 'The June 12 quarterly dividend declaration ($0.75 per share) is routine capital return; treating it as evidence of changed economics is a defect.'
known_traps:
- 'Boundary inversion with the sibling positive case msft.fy2024.q4.capacity_economics: the SAME July 30 press release/transcript documents are producer evidence there but evaluator-only here; copying that case''s producer fields across is the canonical failure mode for this control.'
- 'Treating the 2024-07-16 scheduling notice as material: converting confirmed release timing into any revenue, EPS, Azure growth, cloud gross margin, capex, operating cash flow, free cash flow, capacity, or European-demand claim breaks the control; the notice supports at most a superficial scheduling observation.'
- 'Reading the 2024-07-24 Lumen Technologies partnership release as an AI-capacity signal: it quantifies no capacity economics, capex, or margins; inferring capex acceleration or AI supply/demand tightness from it is fabricated causality.'
- 'Backdating knowledge of the Q4 outcome of the April guidance: the 30%-31% constant-currency Azure range was officially guided on April 25 and may be cited as standing guidance, but its Q4 resolution ("low end", miss/hit) does not exist until 2024-07-30 and must never appear as known.'
- 'Accepting any pre-release figure for Q4 capital expenditures including finance leases ($19B), Microsoft Cloud gross margin (~69%), operating cash flow ($37.2B), or free cash flow ($23.3B): none exists before the release.'
- 'Letting the FY2024 Form 10-K leak into producer-side reasoning: although it covers the same fiscal year, its filing instant is on the excluded side of the cut and is evaluator-only.'
