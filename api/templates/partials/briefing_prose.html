<section class="section briefing-section" id="briefing-section"
         hx-get="/partials/briefing"
         hx-trigger="cycleComplete from:body"
         hx-swap="outerHTML">
  {% if briefing_bullets %}
    <div class="section-heading">
      <span class="label">Briefing</span>
      {% set d = dot if dot is defined else dots.briefing %}
      {% if d.state %}<span class="section-dot dot-{{ d.state }}" title="{{ d.title }}" aria-label="{{ d.state }}"></span>{% endif %}
    </div>
    <div class="briefing-prose">
      {% for section in briefing_bullets %}
        <div class="briefing-block">
          <div class="briefing-label">{{ section.label }}</div>
          <ul class="compact-list">
            {% for bullet in section.bullets %}
              <li>{{ bullet }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endfor %}
    </div>
  {% endif %}
</section>
