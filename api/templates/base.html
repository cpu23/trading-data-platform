<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Trading data{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <meta name="csrf-token" content="{{ request.state.csrf_token | default('') }}">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/vendor/chart.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}

    <footer class="page-footer">
      {% if request.url.path == '/logs' %}<a href="/">Dashboard</a>{% else %}<a href="/logs">View logs</a>{% endif %}
      <span class="dim" style="margin:0 8px">·</span><a href="/quality">Data quality</a>
    </footer>
  </div>

  <!-- Indicator modal -->
  <div id="indicator-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div id="modal-title" class="modal-title"></div>
        <button class="modal-close" aria-label="Close modal">&times;</button>
      </div>
      <div id="modal-chart-container" class="chart-frame" data-chart="indicator" aria-busy="true">
        <div id="modal-status" class="chart-status" role="status" aria-live="polite">Loading series…</div>
        <canvas id="modal-chart" aria-label="Indicator history chart" role="img"></canvas>
      </div>
    </div>
  </div>
</body>
</html>
