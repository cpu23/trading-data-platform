[project]
name = "trading-data-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff==0.12.11",
]

[tool.ruff.lint]
select = ["E9", "F401", "F63", "F7", "F82"]
