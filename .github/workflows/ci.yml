name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/orchestrator:${{ github.workspace }}/api
  STATE_DIR: /tmp/trading-api-tests

jobs:
  unit:
    name: Unit and PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb@sha256:95a7997408e3295935e4afe8af8c09aae22bd51732131d1e7351c63d6198a71c
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: correct-horse-battery-staple
          POSTGRES_DB: trading_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d trading_data_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv with cache
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --frozen
      - name: Run API tests
        env:
          CONFIG_DIR: config
          DEPLOYMENT_MODE: test
          DISABLE_AUTH: "true"
          DB_USER: ci
          DB_PASSWORD: correct-horse-battery-staple
          FRED_API_KEY: ci-disabled
          OPENROUTER_API_KEY: ci-disabled
          OPENROUTER_MODEL: demo/disabled
          OANDA_API_KEY: ci-disabled
        run: uv run python scripts/run_bounded_tests.py discover -s api/tests -v
      - name: Run orchestrator tests
        env:
          TEST_DATABASE_URL: postgresql://ci:correct-horse-battery-staple@localhost:5432/trading_data_test
        run: uv run python scripts/run_bounded_tests.py discover -s orchestrator/tests -v

  static:
    name: Static and infrastructure gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv with cache
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --frozen
      - name: Compile Python sources
        run: uv run python -m compileall -q -x '/\.venv/' api orchestrator contracts scripts tests
      - name: Run Ruff
        run: uv run ruff check api orchestrator contracts scripts tests
      - name: Run mypy
        run: uv run mypy api/api_db.py api/config.py orchestrator/db.py orchestrator/config_loader.py contracts
      - name: Validate YAML and deterministic fixtures
        run: uv run python scripts/validate_fixtures.py
      - name: Validate infrastructure source
        run: uv run python scripts/run_bounded_tests.py discover -s tests -v
      - name: Create CI environment file
        run: cp .env.example .env
      - name: Validate production Compose
        run: docker compose config --quiet
      - name: Validate demo Compose
        run: docker compose -f docker-compose.demo.yml config --quiet

  benchmark:
    name: Published API benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install locked environment
        run: uv sync --frozen
      - name: Collect deterministic benchmark trend
        run: uv run python scripts/benchmark_api.py --fixture --warm-count 5 --output benchmark-api.json
      - name: Upload benchmark trend artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-api-${{ github.run_id }}
          path: benchmark-api.json
          if-no-files-found: warn
          retention-days: 30

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install locked environment
        run: uv sync --frozen
      - name: Audit installed dependencies
        run: uv run --with pip-audit==2.9.0 pip-audit --local --progress-spinner off

  demo-smoke:
    name: Credential-free demo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and smoke demo topology
        run: scripts/smoke_test.sh
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trading-data-platform:0.1.0
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Always tear down demo and volumes
        if: always()
        run: docker compose -f docker-compose.demo.yml down --volumes --remove-orphans
