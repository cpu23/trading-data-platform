name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv with cache
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install locked API environment
        working-directory: api
        run: uv sync --frozen
      - name: Run API unit tests
        working-directory: api
        env:
          CONFIG_DIR: ../config
          DB_USER: ci
          DB_PASSWORD: correct-horse-battery-staple
          FRED_API_KEY: ci-disabled
          OPENROUTER_API_KEY: ci-disabled
          OPENROUTER_MODEL: demo/disabled
          OANDA_API_KEY: ci-disabled
          DASHBOARD_USER: ci
          DASHBOARD_PASSWORD: ci
        run: uv run python -m unittest discover -s tests -v

  orchestrator-unit:
    name: Orchestrator unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb@sha256:95a7997408e3295935e4afe8af8c09aae22bd51732131d1e7351c63d6198a71c
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: correct-horse-battery-staple
          POSTGRES_DB: trading_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d trading_data_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv with cache
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: orchestrator/uv.lock
      - name: Install locked orchestrator environment
        working-directory: orchestrator
        run: uv sync --frozen
      - name: Run orchestrator unit tests
        working-directory: orchestrator
        env:
          TEST_DATABASE_URL: postgresql://ci:correct-horse-battery-staple@localhost:5432/trading_data_test
        run: uv run python -m unittest discover -s tests -v
  benchmark:
    name: Published API benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv with cache
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: orchestrator/uv.lock
      - name: Install locked benchmark environment
        working-directory: orchestrator
        run: uv sync --frozen
      - name: Collect deterministic benchmark trend
        working-directory: orchestrator
        run: uv run python ../scripts/benchmark_api.py --fixture --warm-count 5 --output benchmark-api.json
      - name: Upload benchmark trend artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-api-${{ github.run_id }}
          path: orchestrator/benchmark-api.json
          if-no-files-found: warn
          retention-days: 30


  static:
    name: Static, migration, and fixture gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv with cache
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            orchestrator/uv.lock
            api/uv.lock
      - name: Install validation environment
        working-directory: orchestrator
        run: uv sync --frozen
      - name: Install API environment for failure drills
        working-directory: api
        run: uv sync --frozen
      - name: Compile Python sources
        run: python -m compileall -q -x '/\.venv/' api orchestrator scripts tests
      - name: Run API Ruff quality gates
        working-directory: api
        run: uv run ruff check .
      - name: Run orchestrator Ruff quality gates
        working-directory: orchestrator
        run: uv run ruff check .
      - name: Type-check orchestrator database, configuration, and contracts
        working-directory: orchestrator
        run: uv run mypy db.py config_loader.py ../contracts
      - name: Type-check API database, configuration, and contracts
        working-directory: api
        run: uv run mypy db.py config.py ../contracts
      - name: Validate migration inventory and behavior
        working-directory: orchestrator
        run: uv run python -m unittest tests/test_migrations.py -v
      - name: Validate YAML and deterministic fixtures
        run: orchestrator/.venv/bin/python scripts/validate_fixtures.py
      - name: Validate infrastructure source
        run: orchestrator/.venv/bin/python -m unittest discover -s tests -v
      - name: Create CI environment file
        run: cp .env.example .env
      - name: Validate production Compose
        env: &ci_environment
          DB_USER: ci
          DB_PASSWORD: correct-horse-battery-staple
          DB_NAME: trading_data
        run: docker compose config --quiet
      - name: Validate demo Compose
        run: docker compose -f docker-compose.demo.yml config --quiet
      - name: Reject whitespace errors
        run: git diff --check

  dependency-audit:
    name: Dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [api, orchestrator]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install locked project
        working-directory: ${{ matrix.project }}
        run: uv sync --frozen
      - name: Audit installed dependencies
        working-directory: ${{ matrix.project }}
        run: uv run --with pip-audit==2.9.0 pip-audit --local --progress-spinner off

  demo-smoke:
    name: Credential-free demo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify clean migration and idempotency
        run: scripts/test_clean_migrations.sh
      - name: Build and smoke demo topology
        run: scripts/smoke_test.sh
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trading-data-platform:0.1.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Always tear down demo and volumes
        if: always()
        run: docker compose -f docker-compose.demo.yml down --volumes --remove-orphans
