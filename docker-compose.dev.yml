# Development-only bind mounts and host database access.
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  postgres:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  web:
    volumes:
      - ./api:/app/api:ro
      - ./orchestrator:/app/orchestrator:ro
      - ./contracts:/app/contracts:ro
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - logsdata:/var/log/trading-data
      - newsdata:/var/lib/trading-data/news:ro
      - operatorstate:/app/state

  worker:
    volumes:
      - ./api:/app/api:ro
      - ./orchestrator:/app/orchestrator:ro
      - ./contracts:/app/contracts:ro
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - newsdata:/var/lib/trading-data/news
      - logsdata:/var/log/trading-data
      - operatorstate:/app/state:ro
