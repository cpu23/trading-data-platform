  # Free/public keyless sources. All are best-effort: bounded fetch settings,
  # official HTTPS origins, and delayed-source semantics (SEC/FINRA/Cboe data
  # is published after the fact; point-in-time timestamps stay explicit).
  issuer_news:
    enabled: true
    # Poll official primary feeds every 30 minutes; conditional HTTP state
    # (ETag/Last-Modified) makes 304 responses a valid empty result.
    schedule: "*/30 * * * *"
    state_path: "/var/lib/trading-data/news/issuer_news/state.json"
    feeds:
      # SEC EDGAR "current events" Atom feed for 8-K filings. SEC fair-access
      # policy requires a descriptive user agent; falls back to the shared
      # SEC_USER_AGENT value. entity_parser resolves each entry's standard
      # "<form> - <company> (<10-digit CIK>) (<role>)" title into the filing
      # company (institution + metadata.cik), with tickers only for the
      # bounded map below; other filers keep the static institution.
      - name: sec_current_8k
        kind: feed
        document_type: regulatory_update
        institution: sec
        entity_parser: sec_edgar
        cik_symbols:
          "0000320193": AAPL
          "0000789019": MSFT
          "0001045810": NVDA
          "0001018724": AMZN
          "0001652044": GOOGL
          "0001326801": META
          "0001318605": TSLA
          "0000019617": JPM
          "0001403161": V
          "0001067983": BRK.B
        url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=include&count=40&output=atom"
        headers:
          User-Agent: "${SEC_USER_AGENT:-TradingDataInvestmentResearch/1.0 (research@trading-data-platform.local)}"
      - name: apple_newsroom
        kind: feed
        document_type: issuer_update
        institution: apple
        url: "https://www.apple.com/newsroom/rss-feed.rss"
        fetch_full_text: true
        max_content_chars: 100000
      - name: nvidia_newsroom
        kind: feed
        document_type: issuer_update
        institution: nvidia
        url: "https://nvidianews.nvidia.com/cats/press_release.xml"
        fetch_full_text: true
        max_content_chars: 100000

      - name: microsoft_source
        kind: feed
        document_type: issuer_update
        institution: Microsoft
        url: "https://news.microsoft.com/source/feed/"
        fetch_full_text: true
        max_content_chars: 100000
        content_origins:
          - "https://www.microsoft.com/"
          - "https://devblogs.microsoft.com/"
