processors:
  macro_regime:
    enabled: true
    depends_on: [fred, oecd, ecb, boe, eia]
    prompt_template: prompts/macro_regime_v2.txt
    schedule: "55 6 * * *"
    thresholds:
      yield_curve:
        deep_inversion: -0.5
        inverted: 0
        flat: 0.5
        normal: 1.5
      vix:
        very_low: 12
        low: 16
        moderate: 20
        elevated: 25
        high: 30
      credit_spread:
        tight: 3.0
        normal: 4.0
        widening: 5.0

  event_impact:
    enabled: false
    depends_on: [forex_factory]
    prompt_template: prompts/event_impact_v1.txt
    schedule: after_dependency

  briefing:
    enabled: true
    depends_on: [macro_regime]
    prompt_template: prompts/briefing_v5.txt
    schedule: "5 7 * * *"
    asset_context:
      EURUSD:
        channels: [US-Eurozone relative growth, relative monetary policy, inflation expectations]
        positioning_effects:
          EUR: "Net long Euro supports EURUSD; net short Euro pressures EURUSD."
      DXY:
        channels: [broad US relative growth, Federal Reserve policy, global risk demand]
      AUDJPY:
        channels: [global growth and risk appetite, Australia-Japan policy differential, commodity demand]
        positioning_effects:
          AUD: "Net long Australian Dollar supports AUDJPY; net short pressures it."
          JPY: "Net long Japanese Yen pressures AUDJPY; net short supports it."
      USDJPY:
        channels: [US-Japan policy differential, yield differential, global risk demand]
        positioning_effects:
          JPY: "Net long Japanese Yen pressures USDJPY; net short supports USDJPY."
      SP500:
        channels: [US growth, inflation and discount rates, credit conditions, systemic stress]
      XAUUSD:
        channels: [real-rate pressure, inflation expectations, dollar conditions, systemic stress]
        channel_effects:
          - "Higher real-rate pressure generally weighs on gold; lower real-rate pressure supports it."
          - "A stronger dollar generally weighs on gold; systemic stress can support safe-haven demand."
      XPTUSD:
        channels: [global industrial growth, automotive demand, energy conditions, dollar conditions]
        channel_effects:
          - "Stronger industrial and automotive demand generally supports platinum; weaker demand pressures it."
          - "A stronger dollar generally pressures platinum."
      GER40:
        channels: [Eurozone and German growth, ECB policy, credit conditions, global trade]
      UK100:
        channels: [UK growth and credit, BoE policy, sterling conditions, global commodity demand]
