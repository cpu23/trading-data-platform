x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
      target: production
    image: trading-data-postgres:0.1.0
    logging: *default-logging
    pids_limit: 256
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-trading_data}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-trading_data}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-data-platform:0.1.0
    logging: *default-logging
    pids_limit: 128
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    working_dir: /app/api
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - logsdata:/var/log/trading-data
      - newsdata:/var/lib/trading-data/news:ro
      - operatorstate:/app/state
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-data-platform:0.1.0
    logging: *default-logging
    pids_limit: 256
    mem_limit: 2g
    security_opt: ["no-new-privileges:true"]
    working_dir: /app/orchestrator
    command: ["/app/.venv/bin/python", "-m", "roles", "run", "worker"]
    env_file: .env
    environment:
      HF_HOME: /var/lib/trading-data/news/models/huggingface
      XDG_CACHE_HOME: /var/lib/trading-data/news/.cache
    volumes:
      - newsdata:/var/lib/trading-data/news
      - logsdata:/var/log/trading-data
      - operatorstate:/app/state:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30m
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "roles", "check", "worker"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  newsdata:
  logsdata:
  operatorstate:
