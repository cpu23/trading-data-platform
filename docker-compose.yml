services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: trading_data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d trading_data"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build: ./orchestrator
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./logs:/var/log/trading-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: ./api
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./logs:/var/log/trading-data
      - ./api/static:/app/static:ro
      - ./api/templates:/app/templates:ro
      - ./api/routes:/app/routes:ro
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
