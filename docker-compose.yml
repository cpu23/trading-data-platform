services:
  postgres:
    image: timescale/timescaledb@sha256:95a7997408e3295935e4afe8af8c09aae22bd51732131d1e7351c63d6198a71c
    pids_limit: 256
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-trading_data}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-trading_data}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-data-platform:0.1.0
    pids_limit: 64
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    working_dir: /app/orchestrator
    command: ["/app/orchestrator/.venv/bin/python", "cli.py", "migrate"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./db/migrations:/app/db/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-data-platform:0.1.0
    pids_limit: 128
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    working_dir: /app/orchestrator
    command: ["/app/orchestrator/.venv/bin/python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - newsdata:/var/lib/trading-data/news
      - logsdata:/var/log/trading-data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/orchestrator/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-data-platform:0.1.0
    pids_limit: 128
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    working_dir: /app/api
    command: ["/app/api/.venv/bin/python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - logsdata:/var/log/trading-data
      - ./api/static:/app/api/static:ro
      - ./api/templates:/app/api/templates:ro
      - ./api/routes:/app/api/routes:ro
      - newsdata:/var/lib/trading-data/news:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/api/.venv/bin/python -c \"import base64,os,urllib.request; token=base64.b64encode((os.environ['DASHBOARD_USER']+':' + os.environ['DASHBOARD_PASSWORD']).encode()).decode(); request=urllib.request.Request('http://127.0.0.1:8000/api/system/health',headers={'Authorization':'Basic '+token}); urllib.request.urlopen(request,timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  newsdata:
  logsdata:
